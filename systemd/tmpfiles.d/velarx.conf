# SPDX-License-Identifier: Apache-2.0
# Installed as /usr/lib/tmpfiles.d/velarx.conf.
#
# The state directory of the root daemon: the runtime state of the
# containers that run, which a boot empties (the data of the containers,
# volumes and pods are in the root directory, under /var/lib).
d /run/velarx 0700 root root -
# The root file systems a container with a user namespace of its own sees
# (/tmp/velarx-rootfs-UID): left alone while in use, removed at boot.
x /tmp/velarx-rootfs-*
R! /tmp/velarx-rootfs-*
