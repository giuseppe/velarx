# SPDX-License-Identifier: Apache-2.0
# The DCO check of a pull request: every commit after the base branch has a
# Signed-off-by line (tests/check-dco.sh, `make check-dco BASE=origin/main`).
name: dco
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # the whole history: the script walks BASE..HEAD
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit of the pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tests/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
