# SPDX-License-Identifier: Apache-2.0
# Fuzz targets of the parsers that take untrusted bytes, for
# cargo-fuzz: `cargo fuzz run TARGET -- -max_total_time=60` here, or
# `cargo fuzz list`.  Each target is a function of velarx::fuzzing; the
# seeds are in corpus/TARGET (what libFuzzer adds there is ignored by git:
# keep an input by giving it a name).  tests/integration/fuzz_corpus.rs replays the
# corpora and mutates the seeds in `cargo test`.
#
# cargo-fuzz needs a nightly compiler (RUSTC_BOOTSTRAP=1 with a stable one)
# and a C++ compiler for libFuzzer; `-s none` builds without the address
# sanitizer, much faster for a crate of this size (the targets are safe
# Rust: a panic is what they find).
[package]
name = "velarx-fuzz"
version = "0.1.0"
publish = false
license = "Apache-2.0"
edition = "2021"
authors = ["The Velarx Authors"]
repository = "https://github.com/giuseppe/velarx"
homepage = "https://github.com/giuseppe/velarx"
rust-version = "1.99"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
velarx = { path = "..", features = ["fuzzing"] }
velarx-kube = { path = "../crates/kube" }

# not a member of the package above
[workspace]
members = ["."]

# (a workspace of its own: the [patch] of the root Cargo.toml, here too;
# `tools/check-patches` compares the two)
[patch.crates-io]
zlink-core = { path = "../vendor/zlink-core" }
zlink-macros = { path = "../vendor/zlink-macros" }
zlink-idl = { path = "../vendor/zlink-idl" }
tar = { path = "../vendor/tar" }
composefs = { path = "../vendor/composefs" }

[profile.release]
debug = 1

[[bin]]
name = "tar"
path = "fuzz_targets/tar.rs"
test = false
doc = false
bench = false

