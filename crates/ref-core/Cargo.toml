[package]
name = "velarx-ref-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The one grammar of an image reference: where its host, path, tag and digest are, and what the name is after the defaults of docker.io"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Plain functions on bytes: no dependency, no I/O.  The crates that read
# a reference from a user, an image, registries.conf or policy.json
# (`velarx-types`, `velarx-registry`, `velarx-signature`) ask it where the
# parts are.

[lib]
name = "velarx_ref_core"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
