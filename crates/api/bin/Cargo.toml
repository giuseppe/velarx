# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-api-bin"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The binary velarx-api"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../base/build-support/bin.rs"

# The binary of the package velarx-api, apart from it so that the commit of
# `--version` reaches nothing but the link (see crates/bin).
[[bin]]
name = "velarx-api"
path = "src/main.rs"
test = false

[dependencies]
velarx-api = { path = ".." }
velarx-sys = { path = "../../sys", features = ["tokio"] }
velarx-base = { path = "../../base" }
velarx-proto = { path = "../../proto" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
rustix = { workspace = true, features = ["fs", "net", "process", "pipe", "event"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi"] }
anyhow.workspace = true

[lints]
workspace = true
