# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The REST API of velarx, a frontend of the engine over varlink"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# A wrapper: it decodes HTTP (the libpod and Docker routes), calls the engine
# through the varlink interface org.velarx.Engine, and encodes the answer.
# It links the interface (`velarx-proto`) and nothing of the engine: no
# storage, no database, no services.
[lib]
name = "velarx_api"
path = "src/lib.rs"
doctest = false

[dependencies]
velarx-proto = { path = "../proto" }
# the words of the refusals of Docker's formats
velarx-base = { path = "../base" }
# podman's and Docker's documents of the engine's records
velarx-shape = { path = "../shape" }
# X-Registry-Auth, decoded into the credentials of a call
velarx-registry = { path = "../registry", default-features = false }
# the transport of an image name: the routes pull from a registry only
velarx-types = { path = "../types", default-features = false }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "query"] }
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing"] }
rustix = { workspace = true, features = ["fs", "net", "process", "pipe", "event"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi"] }
percent-encoding.workspace = true
base64.workspace = true
futures.workspace = true
bytes.workspace = true
# TLS of the TCP listeners (the provider is ring)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
# paused time: a test of a deadline does not wait for it
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
