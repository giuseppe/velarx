# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The content store of velarx: files named by their digest, fs-verity, chunked and sparse files"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The file store and what it needs: no database and no services above it.

[lib]
name = "velarx_storage"
path = "src/lib.rs"
doctest = false

[features]
# the count of the barriers a FileStore made, for the tests of the pull
test-support = []

[dependencies]
velarx-base = { path = "../base" }
velarx-types = { path = "../types" }
rustix = { workspace = true, features = ["fs", "process"] }
velarx-sys = { path = "../sys" }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
tempfile.workspace = true
base64.workspace = true
rayon.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "fs"] }

[dev-dependencies]
composefs.workspace = true
tar.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
rustix = { workspace = true, features = ["pipe"] }

[lints]
workspace = true
