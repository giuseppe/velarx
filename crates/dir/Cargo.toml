# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-dir"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The binary velarx-dir: the fetcher of a directory of items named by their digests"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../base/build-support/bin.rs"

# The fetcher of a directory (`[[sources.external]]` with a `dir`), a binary
# of its own beside velarx: the engine finds it next to itself (or where
# `[pull] dir_path` says) and starts it for each connection with
# `--varlink-fd`.  It links the serving end of the fetcher interface
# (`velarx-content`) and the confinement (`velarx-sandbox`), and no registry
# or HTTP client code (`tools/check-deps`).
[[bin]]
name = "velarx-dir"
path = "src/main.rs"
test = false

[dependencies]
velarx-content = { path = "../content" }
velarx-sandbox = { path = "../sandbox" }
velarx-sys = { path = "../sys" }
velarx-base = { path = "../base" }
velarx-wire = { path = "../wire" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
serde_json.workspace = true
rustix = { workspace = true, features = ["fs"] }
anyhow.workspace = true

[lints]
workspace = true
