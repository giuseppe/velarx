# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-storage-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The client of org.velarx.Storage: the StorageDriver trait over a unix socket, to a storage driver that is a program of its own"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true


[lib]
name = "velarx_storage_client"
path = "src/lib.rs"
doctest = false

[dependencies]
bytes.workspace = true
velarx-graph = { path = "../graph" }
velarx-wire = { path = "../wire" }
velarx-base = { path = "../base" }
velarx-types = { path = "../types" }
velarx-db = { path = "../db" }
velarx-storage = { path = "../storage" }
velarx-content = { path = "../content" }
velarx-fuse = { path = "../fuse" }
velarx-proto = { path = "../proto", default-features = false, features = ["proxy"] }
async-trait.workspace = true
futures.workspace = true
rustix = { workspace = true, features = ["fs", "net", "pipe", "event", "mount", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
zlink = { workspace = true, features = ["tokio", "proxy"] }

[dev-dependencies]
velarx-graph = { path = "../graph", features = ["conformance"] }
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing", "idl-parse"] }

[lints]
workspace = true
