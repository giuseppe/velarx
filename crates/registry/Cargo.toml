# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Registry configuration, credentials and the registry client of velarx"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# registries.conf, the credential files and helpers, and the certificates
# are used by the thin client too (blocking code only); the client, the
# transport and the hints are the engine's (`engine`).

[lib]
name = "velarx_registry"
path = "src/lib.rs"
doctest = false

[features]
default = []
# The endpoints, credentials and certificates of the registries and the
# manifests of images (`target`, `hints`): what the engine needs to describe
# a registry to a fetcher, without an HTTP client.
engine = ["dep:velarx-types", "dep:bytes", "dep:futures"]
# The HTTP client of the registries (`client`, `transport`): only the
# fetchers, which make the requests.
net = ["engine", "velarx-types/http", "dep:reqwest", "dep:tokio", "dep:percent-encoding", "dep:hyper"]

[dependencies]
velarx-base = { path = "../base" }
velarx-types = { path = "../types", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true
toml.workspace = true
base64.workspace = true
tracing.workspace = true
chrono.workspace = true
tempfile.workspace = true
percent-encoding = { workspace = true, optional = true }
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process", "event", "pipe", "net", "thread"] }
velarx-sys = { path = "../sys" }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "rt"], optional = true }
hyper = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "sync", "time", "process", "net", "signal", "fs", "io-util", "io-std"] }
axum = { workspace = true, features = ["tokio", "http1", "query"] }

[lints]
workspace = true
