# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-kube"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "kube play, generate and apply: Kubernetes YAML to pods and containers and back"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

# A frontend of the engine, like velarx-api and velarx-cri: it links the
# interface (`velarx-proto`) and nothing of the engine, and the engine links
# nothing of it.

[lib]
name = "velarx_kube"
path = "src/lib.rs"
doctest = false

[dependencies]
velarx-base = { path = "../base" }
velarx-proto = { path = "../proto" }
velarx-registry = { path = "../registry", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
url.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }
tar.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
zlink = { workspace = true, features = ["tokio", "proxy", "tracing"] }
# the requests to the API server of a cluster
reqwest.workspace = true
# the YAML of Kubernetes, without the encodings (UTF-8 only)
yaml-rust2.workspace = true

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
