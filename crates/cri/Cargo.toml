# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-cri"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The Kubernetes CRI frontend of velarx: runtime.v1 over gRPC, a wrapper over the engine"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "velarx_cri"
path = "src/lib.rs"
doctest = false

[[test]]
name = "cri"
path = "tests/cri/main.rs"

[dependencies]
tonic.workspace = true
prost = "0.13"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tokio-stream = { workspace = true, features = ["net"] }
futures.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
http-body-util = "0.1"
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
flate2.workspace = true
sha1 = "0.10"
sha2.workspace = true
rustix = { workspace = true, features = ["process", "fs", "rand", "event", "net"] }
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing"] }
velarx-proto = { path = "../proto" }
velarx-sys = { path = "../sys" }
# the credentials of a pull are a `RegistryAccess`
velarx-registry = { path = "../registry", default-features = false }
zeroize.workspace = true
# the default directories of the engine
velarx-base = { path = "../base" }

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[dev-dependencies]
tempfile.workspace = true
velarx-wire = { path = "../wire", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
