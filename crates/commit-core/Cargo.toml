[package]
name = "velarx-commit-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The commit decision of a staged file: what it takes for a file to be given its name in the object store"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Plain functions on digests the shell computes: no dependency, no I/O.  The
# shell that opens, measures, reads, copies and links is `velarx-content`
# (pull/commit.rs).

[lib]
name = "velarx_commit_core"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
