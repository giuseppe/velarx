# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The varlink interface org.velarx.Engine (types and client) and what the frontends of the engine share"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

# The types of the interface and the client side of it: the engine
# (`velarx`) serves it, the frontends (`velarx-api`, `velarx-cri`) use
# it.  Nothing here knows the storage, the database or the services.
build = "build.rs"

[lib]
name = "velarx_proto"
path = "src/lib.rs"
doctest = false

[features]
# The interface, its client and the confinement of a frontend (zlink, tokio,
# Landlock, seccomp).  Without it only the types of the documents (the pod
# spec): what the thin client of velarx compiles.
default = ["service"]
# The interface and its typed proxy, without a runtime: what the thin client
# of velarx uses to call the engine over a blocking socket.
proxy = ["dep:zlink-core"]
# The copy loop of a session (the replies of `ContainerAttach` and
# `ExecStart`, and the engine's end of them): what the thin client of velarx
# uses to attach, with a runtime of its own.
session = ["proxy", "dep:tokio", "dep:rustix", "velarx-sys/tokio"]
service = ["proxy", "session", "dep:zlink", "dep:flate2", "dep:tokio", "dep:rustix", "dep:tracing", "dep:libc", "dep:landlock", "dep:seccompiler", "velarx-sys/seccompiler", "velarx-sys/landlock", "velarx-sys/tokio"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# (the key and passphrase of a signing push are wiped when dropped)
zeroize.workspace = true
# (the library without a runtime, for the proxy; `zlink` is the same library
# with tokio and the service macros, for the engine and the frontends)
zlink-core = { workspace = true, features = ["std", "proxy", "introspection", "tracing"], optional = true }
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing"], optional = true }
flate2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"], optional = true }
rustix = { workspace = true, features = ["fs", "net", "process", "pipe", "thread", "event"], optional = true }
velarx-sys = { path = "../sys" }
tracing = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }
seccompiler = { workspace = true, optional = true }

[build-dependencies]
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
