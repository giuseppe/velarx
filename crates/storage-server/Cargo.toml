# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-storage-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The reference server of org.velarx.Storage: the vfs storage driver behind a unix socket"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# A storage service in a package of its own: it depends on the driver it serves
# (velarx-vfs), the interface (velarx-graph, velarx-storage-client) and the
# packages below them, never on velarx-core.

[lib]
name = "velarx_storage_server"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "velarx-storage-server"
path = "src/main.rs"

[features]
# the subject of the conformance suite: a client of this server
conformance = ["velarx-graph/conformance"]

[dependencies]
velarx-vfs = { path = "../vfs" }
velarx-graph = { path = "../graph" }
velarx-storage-client = { path = "../storage-client" }
velarx-pull-core = { path = "../pull-core" }
velarx-proto = { path = "../proto", default-features = false }
velarx-content = { path = "../content" }
velarx-base = { path = "../base" }
velarx-wire = { path = "../wire" }
velarx-db = { path = "../db" }
velarx-storage = { path = "../storage" }
velarx-fuse = { path = "../fuse" }
velarx-types = { path = "../types" }
rustix = { workspace = true, features = ["fs", "net", "pipe", "event", "process", "mount"] }
velarx-sys = { path = "../sys" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
velarx-storage-server = { path = ".", features = ["conformance"] }
velarx-graph = { path = "../graph", features = ["conformance"] }
velarx-vfs = { path = "../vfs" }
tempfile.workspace = true
tar.workspace = true
velarx-config = { path = "../config" }
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
