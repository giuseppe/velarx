# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-content"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "How the content of images gets into the store: pull, fetchers, sources, layers, archives"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Everything that moves image content into the store (22k LOC of pull, 7k
# of fetchers) and nothing of the services above it.

[lib]
name = "velarx_content"
path = "src/lib.rs"
doctest = false

[features]
# fetchers for the tests of the crates above (`velarx_content::fakes`)
test-support = []

[dependencies]
velarx-proto = { path = "../proto", features = ["service"] }
velarx-sys = { path = "../sys", features = ["tokio", "seccompiler"] }
velarx-base = { path = "../base" }
velarx-types = { path = "../types" }
velarx-registry = { path = "../registry", features = ["engine"] }
velarx-config = { path = "../config", features = ["engine"] }
velarx-db = { path = "../db" }
velarx-storage = { path = "../storage" }
velarx-fuse = { path = "../fuse" }
velarx-wire = { path = "../wire" }
velarx-tarsplit = { path = "../tarsplit" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "signal", "fs", "io-util", "io-std"] }
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true
toml.workspace = true
rustix = { workspace = true, features = ["mount", "fs", "termios", "process", "net", "rand", "event", "pipe", "pty", "stdio", "thread"] }
zstd.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
futures.workspace = true
bytes.workspace = true
hex.workspace = true
libc.workspace = true
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
rayon.workspace = true
async-trait.workspace = true
sha2.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
rand.workspace = true
velarx-storage = { path = "../storage", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "net", "rt-multi-thread", "macros"] }

[lints]
workspace = true
