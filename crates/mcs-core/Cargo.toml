# Plain functions on bytes and numbers: no dependency, no I/O.  The source of
# randomness, the levels the containers have (the database), the policy files
# and the labels of files stay in `velarx-runtime` (container/selinux.rs) and
# `velarx-core`.

[lib]
name = "velarx_mcs_core"
path = "src/lib.rs"
doctest = false

