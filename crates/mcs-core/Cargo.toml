[package]
name = "velarx-mcs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The SELinux MCS levels of containers: what a level may be, which two containers reach each other's files, and the fresh pair of categories"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
