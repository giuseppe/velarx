# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-registry-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The fetcher: the process that fetches content for velarx (the registry, the sources) behind org.velarx.Fetcher, its server side and its lifetime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "velarx_registry_lib"
path = "src/lib.rs"
doctest = false

[dependencies]
velarx-content = { path = "../content" }
velarx-proto = { path = "../proto", features = ["service"] }
velarx-sandbox = { path = "../sandbox" }
velarx-sys = { path = "../sys", features = ["tokio", "seccompiler"] }
velarx-base = { path = "../base" }
velarx-types = { path = "../types" }
velarx-registry = { path = "../registry", features = ["net"] }
velarx-config = { path = "../config", features = ["engine"] }
velarx-wire = { path = "../wire" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "signal", "fs", "io-util", "io-std"] }
zlink = { workspace = true, features = ["tokio", "proxy", "service", "tracing"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rustix = { workspace = true, features = ["mount", "fs", "termios", "process", "net", "rand", "event", "pipe", "pty", "stdio", "thread"] }
tracing.workspace = true
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
futures.workspace = true
landlock.workspace = true
libc.workspace = true
hex.workspace = true
bytes.workspace = true
velarx-db = { path = "../db" }
velarx-storage = { path = "../storage" }
velarx-fuse = { path = "../fuse" }
velarx-tarsplit = { path = "../tarsplit" }
toml.workspace = true
zstd.workspace = true
thiserror.workspace = true
reqwest.workspace = true
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
flate2.workspace = true
tar.workspace = true
seccompiler.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
rayon.workspace = true

[dev-dependencies]
rand.workspace = true
velarx-storage = { path = "../storage", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "net", "rt-multi-thread", "macros"] }
axum = { workspace = true, features = ["tokio", "http1"] }

[lints]
workspace = true
