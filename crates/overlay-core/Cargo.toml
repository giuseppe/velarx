[package]
name = "velarx-overlay-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "What of an entry of an image may reach the overlay file system: the names of its extended attributes and its device numbers"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Plain functions on bytes and numbers: no dependency, no I/O.  The crates
# that read the entries of a layer (`velarx-content`, `velarx-storage`) and
# write them as an image (`velarx-fuse`) ask it, so that one rule says what
# an image may give the overlay mounted over it.

[lib]
name = "velarx_overlay_core"
path = "src/lib.rs"
doctest = false

