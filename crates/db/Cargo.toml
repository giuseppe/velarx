# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The database of the store of velarx: images, layers, containers, volumes, networks"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

# SQLite, the only code that links rusqlite; it knows the store
# (`velarx-storage`) and the configuration but none of the services.

[lib]
name = "velarx_db"
path = "src/lib.rs"
doctest = false

[features]
# `Database::stop`, for the tests of the crates that use the database
test-support = []

[dependencies]
velarx-sys = { path = "../sys", features = ["tokio"] }
velarx-base = { path = "../base" }
velarx-types = { path = "../types" }
velarx-storage = { path = "../storage" }
velarx-config = { path = "../config", features = ["engine"] }
rusqlite.workspace = true
tokio-rusqlite.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "fs", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
rustix = { workspace = true, features = ["fs", "process"] }
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
