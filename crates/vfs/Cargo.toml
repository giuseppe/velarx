# SPDX-License-Identifier: Apache-2.0
[package]
name = "velarx-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The vfs storage driver of velarx: a full copy of the files of the image for each container, made when it is created"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# A storage driver in a package of its own: it depends on the interface
# (velarx-graph) and the packages below it, never on velarx-core.  The engine
# makes it in `storage_driver::open`.

[lib]
name = "velarx_vfs"
path = "src/lib.rs"
doctest = false

[dependencies]
velarx-graph = { path = "../graph" }
velarx-sys = { path = "../sys" }
velarx-types = { path = "../types" }
velarx-config = { path = "../config" }
velarx-db = { path = "../db" }
velarx-storage = { path = "../storage" }
velarx-content = { path = "../content" }
velarx-fuse = { path = "../fuse" }
velarx-wire = { path = "../wire" }
velarx-proto = { path = "../proto", default-features = false }
async-trait.workspace = true
rustix = { workspace = true, features = ["fs", "process", "thread", "mount"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
velarx-graph = { path = "../graph", features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "macros"] }
zstd.workspace = true

[lints]
workspace = true
